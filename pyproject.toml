[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-sleep-stage-research"
version = "1.1.0"
description = "End-to-end educational EEG sleep staging research pipeline with honest, reproducible evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Oussama Beniaich" }]
keywords = ["EEG", "sleep staging", "signal processing", "machine learning", "neuroscience"]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "pandas>=2.0,<3",
  "scikit-learn>=1.4,<2",
  "mne>=1.8,<2",
  "torch>=2.2,<3",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jupyterlab>=4,<5", "ipykernel>=6,<8", "nbformat>=5,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
